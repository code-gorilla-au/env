---
name: env pull request pipeline.

on:
  pull_request:
    types: [opened, synchronize, reopened]


jobs:

  golang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install tools
        run: make tools-get

      - name: test + lint + scan
        run: make ci